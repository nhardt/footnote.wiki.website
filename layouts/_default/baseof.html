<!doctype html>
<html lang="en" class="scroll-smooth">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ .Title }} - {{ .Site.Title }}</title>
        <meta name="description" content="{{ .Site.Params.description }}" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />

        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["IBM Plex Sans", "sans-serif"],
                            mono: ["JetBrains Mono", "monospace"],
                        },
                    },
                },
            };
        </script>
    </head>
    <body class="bg-zinc-900 text-zinc-100 font-sans">
        <nav class="border-b border-zinc-800">
            <div
                class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between"
            >
                <a
                    href="/"
                    class="text-xl font-mono font-semibold hover:text-zinc-300 transition"
                    >footnote.wiki</a
                >
                <div class="flex gap-8 text-sm">
                    <a
                        href="/"
                        class="text-zinc-400 hover:text-zinc-100 transition"
                        >Home</a
                    >
                    <a
                        href="/privacy"
                        class="text-zinc-400 hover:text-zinc-100 transition"
                        >Privacy Policy</a
                    >
                    <a
                        href="https://github.com/nhardt/footnote"
                        class="text-zinc-400 hover:text-zinc-100 transition"
                        >Github</a
                    >
                </div>
            </div>
        </nav>

        <main>{{ block "main" . }}{{ end }}</main>

        <footer class="border-t border-zinc-800">
            <div
                class="max-w-4xl mx-auto px-6 py-8 flex justify-between items-center text-sm text-zinc-500"
            >
                <div>© 2026 Footnote</div>
                <div class="flex gap-6">
                    <a href="/privacy" class="hover:text-zinc-300 transition"
                        >Privacy</a
                    >
                    <a
                        href="{{ .Site.Params.personal_site }}"
                        class="hover:text-zinc-300 transition"
                        >About me</a
                    >
                </div>
            </div>

            <div class="text-center text-zinc-500 text-sm">
                <p>
                    Created by
                    <a
                        href="https://natehardt.dev"
                        class="text-zinc-400 hover:text-zinc-100 transition"
                        >Nate Hardt</a
                    >
                </p>
                <p class="mt-2">
                    Inspired by
                    <a
                        href="https://www.inkandswitch.com/local-first/"
                        class="text-zinc-400 hover:text-zinc-100 transition"
                        >Ink & Switch</a
                    >
                    and the
                    <a
                        href="https://lofi.so/"
                        class="text-zinc-400 hover:text-zinc-100 transition"
                        >local-first community</a
                    >
                </p>
                <p class="mt-2">
                    Built with
                    <a
                        href="https://dioxuslabs.com/"
                        class="text-zinc-400 hover:text-zinc-100 transition"
                        >Dioxus</a
                    >,
                    <a
                        href="https://iroh.computer/"
                        class="text-zinc-400 hover:text-zinc-100 transition"
                        >Iroh</a
                    >, and
                    <a
                        href="https://github.com/nhardt/footnote/blob/main/Cargo.toml"
                        class="text-zinc-400 hover:text-zinc-100 transition"
                        >others</a
                    >
                </p>
            </div>
        </footer>
    </body>
</html>
